name = "gta5-browser"
main = "worker.js"
compatibility_date = "2026-10-01"

# Matching public client files bypass the metered Worker; missing paths retain
# the existing private-R2 range/batch handler. Generate this allowlisted stage
# with build_static.py. Do not point it at the repository or original data tree.
[assets]
directory = "../.downloads/static-public"
binding = "STATIC"
run_worker_first = false
not_found_handling = "none"

[cache]
enabled = true

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "gta5-browser"

# Account and token are provided through environment variables.
